# Despliegue de https://malaga-iam.website en Plesk (Profesional Hosting)
name: Deploy a Plesk (malaga-iam.website)

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "img/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Comprobar secretos (sin mostrar su contenido)
        env:
          H: ${{ secrets.PLESK_HOST }}
          U: ${{ secrets.PLESK_USER }}
          K: ${{ secrets.PLESK_SSH_KEY }}
          W: ${{ secrets.PLESK_PASSWORD }}
          P: ${{ secrets.PLESK_PORT }}
          T: ${{ secrets.PLESK_TARGET_DIR }}
        run: |
          first=$(printf '%s' "$K" | head -n1 | grep -oE 'BEGIN [A-Z ]+KEY' || echo 'sin cabecera BEGIN')
          lines=$(printf '%s' "$K" | wc -l)
          echo "::notice title=Diagnostico secretos::HOST=${#H} USER=${#U} KEY=${#K} (lineas=$lines, $first) PASSWORD=${#W} PORT=${#P} TARGET=${#T}"

      - name: Copiar web al servidor por SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PLESK_HOST }}
          username: ${{ secrets.PLESK_USER }}
          key: ${{ secrets.PLESK_SSH_KEY }}
          password: ${{ secrets.PLESK_PASSWORD }}
          port: ${{ secrets.PLESK_PORT || 22 }}
          source: "index.html,img"
          target: ${{ secrets.PLESK_TARGET_DIR }}
          overwrite: true
