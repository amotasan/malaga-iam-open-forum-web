# Despliegue de https://malaga-iam.website en Plesk (Profesional Hosting) · SCP con clave o contraseña
name: Deploy a Plesk (malaga-iam.website)

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "img/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Comprobar secretos (sin mostrar su contenido)
        env:
          H: ${{ secrets.PLESK_HOST }}
          U: ${{ secrets.PLESK_USER }}
          K: ${{ secrets.PLESK_SSH_KEY }}
          W: ${{ secrets.PLESK_PASSWORD }}
          P: ${{ secrets.PLESK_PORT }}
          T: ${{ secrets.PLESK_TARGET_DIR }}
        run: |
          first=$(printf '%s' "$K" | head -n1 | grep -oE 'BEGIN [A-Z ]+KEY' || echo 'sin cabecera BEGIN')
          lines=$(printf '%s' "$K" | wc -l)
          echo "::notice title=Diagnostico secretos::HOST=${#H} USER=${#U} KEY=${#K} (lineas=$lines, $first) PASSWORD=${#W} PORT=${#P} TARGET=${#T}"

      - name: Probar conexión SSH
        continue-on-error: true
        env:
          H: ${{ secrets.PLESK_HOST }}
          U: ${{ secrets.PLESK_USER }}
          W: ${{ secrets.PLESK_PASSWORD }}
          P: ${{ secrets.PLESK_PORT }}
          T: ${{ secrets.PLESK_TARGET_DIR }}
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null 2>&1 || true
          if timeout 10 bash -c "</dev/tcp/$H/${P:-22}" 2>/dev/null; then tcp=abierto; else tcp=cerrado; fi
          banner=$(timeout 8 bash -c "exec 3<>/dev/tcp/$H/${P:-22}; head -c 60 <&3" 2>/dev/null | tr -d '\r\n' || true)
          out=$(SSHPASS="$W" timeout 30 sshpass -e ssh -o StrictHostKeyChecking=no -o PubkeyAuthentication=no -p "${P:-22}" "$U@$H" "echo SHELL_OK; test -d '$T' && echo DIR_OK || echo DIR_NO; test -w '$T' && echo W_OK || echo W_NO" 2>&1 | tail -n 4 | tr '\n' ' ')
          echo "::notice title=Prueba SSH::puerto=$tcp | banner=[$banner] | resultado=[$out]"

      - name: Copiar web al servidor por SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PLESK_HOST }}
          username: ${{ secrets.PLESK_USER }}
          key: ${{ secrets.PLESK_SSH_KEY }}
          password: ${{ secrets.PLESK_PASSWORD }}
          port: ${{ secrets.PLESK_PORT || 22 }}
          source: "index.html,img"
          target: ${{ secrets.PLESK_TARGET_DIR }}
          overwrite: true
